<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Hayley Ho</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Fira+Sans:wght@300;400;500;600&family=Special+Elite&display=swap" rel="stylesheet">

    <style>

        body {
            margin: 0;
            background-color: #ede9df;
            color: #1f1f1f;
            font-family: "Fira Sans", sans-serif;
        }

        header {
            text-align: center;
            padding-top: 35px;
            padding-bottom: 35px;
        }

        #logo {
            width: 190px;
            max-width: 60%;
            display: block;
            margin: 0 auto 25px auto;
        }

        nav {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 45px;
        }

        nav a {
            font-family: "Special Elite", serif;
            font-size: 18px;
            color: #1f1f1f;
            text-decoration: none;
        }

        nav a:hover {
            color: #a8392f;
        }

        main {
            width: 85%;
            max-width: 950px;
            margin: auto;
            padding-top: 55px;
            padding-bottom: 100px;
        }

        .gallery {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 30px;
        }

        .project {
            width: 100%;
            aspect-ratio: 1 / 1;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            text-decoration: none;
        }

        .project img {
            width: 82%;
            height: 82%;
            object-fit: contain;
            display: block;
            transition: transform 0.3s ease;
        }

        .project:hover img {
            transform: scale(1.04);
        }

        .placeholder {
            width: 100%;
            aspect-ratio: 1 / 1;
        }

        @media (max-width: 750px) {

            #logo {
                width: 160px;
            }

            nav {
                gap: 18px 25px;
            }

            nav a {
                font-size: 16px;
            }

            main {
                width: 90%;
                padding-top: 35px;
            }

            .gallery {
                grid-template-columns: repeat(2, 1fr);
                gap: 20px;
            }

        }

    </style>

</head>


<body>


<header>

    <a href="index.html">

        <img
            src="hayleylogotexture.png"
            id="logo"
            alt="Hayley Ho logo"
        >

    </a>


    <nav>

        <a href="fineart.html">
            fine art.
        </a>

        <a href="design.html">
            design.
        </a>

        <a href="motion.html">
            motion.
        </a>

        <a href="immersive.html">
            immersive.
        </a>

        <a href="about.html">
            about.
        </a>

    </nav>

</header>


<main>

    <div class="gallery">


        <!-- Burgie -->

        <a class="project" href="burgie.html">

            <img
                src="burgiefrontpager.png"
                alt="Burgie project"
            >

        </a>


        <!-- future project -->

        <div class="placeholder"></div>


        <!-- future project -->

        <div class="placeholder"></div>


        <!-- future project -->

        <div class="placeholder"></div>


        <!-- future project -->

        <div class="placeholder"></div>


        <!-- future project -->

        <div class="placeholder"></div>


    </div>

</main>


</body>

</html>
