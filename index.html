<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Hayley Ho</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Fira+Sans:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Special+Elite&display=swap" rel="stylesheet">

    <style>

        body {
            margin: 0;
            background-color: #ede9df;
            color: #1f1f1f;
            font-family: "Fira Sans", sans-serif;
        }

        header {
            text-align: center;
            padding-top: 35px;
            padding-bottom: 35px;
        }

        #logo {
            display: block;
            width: 190px;
            max-width: 60%;
            margin: 0 auto 25px auto;
        }

        nav {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 45px;
        }

        nav a {
            font-family: "Special Elite", serif;
            font-size: 18px;
            color: #1f1f1f;
            text-decoration: none;
        }

        nav a:hover {
            color: #a8392f;
        }

        main {
            width: 88%;
            max-width: 1100px;
            margin: auto;
            padding-top: 45px;
            padding-bottom: 80px;
        }

        .section-title {
            font-family: "Special Elite", serif;
            font-size: 20px;
            font-weight: normal;
            margin-bottom: 25px;
        }

        .projects {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 55px 35px;
        }

        .project {
            text-decoration: none;
            color: #1f1f1f;
        }

        .project-image {
            width: 100%;
            aspect-ratio: 4 / 3;
            overflow: hidden;
        }

        .project-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .project-info {
            margin-top: 12px;
        }

        .project-title {
            font-family: "Special Elite", serif;
            font-size: 18px;
            margin: 0;
        }

        .project-category {
            font-size: 13px;
            margin-top: 5px;
            opacity: 0.65;
        }

        .wide {
            grid-column: span 2;
        }

        .wide .project-image {
            aspect-ratio: 16 / 7;
        }

        footer {
            text-align: center;
            padding: 40px 20px;
            font-family: "Special Elite", serif;
            font-size: 14px;
        }

        @media (max-width: 700px) {

            header {
                padding-top: 25px;
            }

            #logo {
                width: 160px;
                margin-bottom: 20px;
            }

            nav {
                gap: 18px 25px;
            }

            nav a {
                font-size: 16px;
            }

            main {
                width: 90%;
                padding-top: 30px;
            }

            .projects {
                grid-template-columns: 1fr;
                gap: 40px;
            }

            .wide {
                grid-column: span 1;
            }

            .wide .project-image {
                aspect-ratio: 4 / 3;
            }

        }

    </style>

</head>

<body>

<header>

    <a href="index.html">

        <img
            src="hayleylogotexture.png"
            id="logo"
            alt="Hayley Ho logo"
        >

    </a>

    <nav>

        <a href="fineart.html">
            fine art.
        </a>

        <a href="design.html">
            design.
        </a>

        <a href="motion.html">
            motion.
        </a>

        <a href="immersive.html">
            immersive.
        </a>

        <a href="about.html">
            about.
        </a>

    </nav>

</header>

<main>

    <h1 class="section-title">
        selected work.
    </h1>

    <div class="projects">

        <a class="project wide" href="burgie-project.html">

            <div class="project-image">

                <img
                    src="burgiefrontpager.png"
                    alt="Burgie interactive burger builder"
                >

            </div>

            <div class="project-info">

                <p class="project-title">
                    Burgie
                </p>

                <p class="project-category">
                    Interactive Web Design / Illustration
                </p>

            </div>

        </a>

        <a class="project" href="#">

            <div class="project-image">

                <img
                    src="placeholder1.jpg"
                    alt="Project placeholder"
                >

            </div>

            <div class="project-info">

                <p class="project-title">
                    Project Title
                </p>

                <p class="project-category">
                    Fine Art
                </p>

            </div>

        </a>

        <a class="project" href="#">

            <div class="project-image">

                <img
                    src="placeholder2.jpg"
                    alt="Project placeholder"
                >

            </div>

            <div class="project-info">

                <p class="project-title">
                    Project Title
                </p>

                <p class="project-category">
                    Motion
                </p>

            </div>

        </a>

        <a class="project" href="#">

            <div class="project-image">

                <img
                    src="placeholder3.jpg"
                    alt="Project placeholder"
                >

            </div>

            <div class="project-info">

                <p class="project-title">
                    Project Title
                </p>

                <p class="project-category">
                    Immersive
                </p>

            </div>

        </a>

        <a class="project" href="#">

            <div class="project-image">

                <img
                    src="placeholder4.jpg"
                    alt="Project placeholder"
                >

            </div>

            <div class="project-info">

                <p class="project-title">
                    Project Title
                </p>

                <p class="project-category">
                    Design
                </p>

            </div>

        </a>

    </div>

</main>

<footer>

    Hayley Ho

</footer>

</body>

</html>
